<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Beautiful modern gradient -->
    <radialGradient id="beaconGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="60%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Glowing Emblem -->
  <circle cx="256" cy="256" r="220" fill="url(#beaconGlow)" filter="url(#shadow)" stroke="#ffffff" stroke-width="16" />

  <!-- High contrast white cross -->
  <path d="M 220 120 L 292 120 L 292 220 L 392 220 L 392 292 L 292 292 L 292 392 L 220 392 L 220 292 L 120 292 L 120 220 L 220 220 Z" fill="#ffffff" />
</svg>